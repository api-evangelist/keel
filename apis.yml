aid: keel
name: Keel
description: >-
  Keel is code-first operations software for growing companies — a modern alternative to
  legacy ERP and no-code tools. Teams model their data and business logic in a declarative
  schema plus TypeScript functions, and Keel generates production-grade JSON and GraphQL
  APIs, a type-safe generated client, authentication (bearer JWT with OIDC/SSO), role-based
  permissions, background jobs, events, multi-step flows, and an admin console with internal
  tools. Built by Planko Ltd (London) and founded in 2022 by operators who scaled the Echo
  pharmacy to 50,000 prescriptions a day and £100M revenue, Keel is backed by Earlybird and
  LocalGlobe and is distributed as an AGPL-3.0 open-source framework plus a hosted platform.
